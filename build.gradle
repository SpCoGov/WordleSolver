plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'top.spco.wordlesolver'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'me.tongfei:progressbar:0.10.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation "org.openjfx:javafx-controls:21.0.4"
    implementation "org.openjfx:javafx-web:21.0.4"
}

javafx {
    version = '21.0.4'
    modules = [ 'javafx.controls', 'javafx.web' ]
}

application {
    mainClass = 'top.spco.wordlesolver.WordleSimViewerApp'
}

// Run web server: ./gradlew runWeb
tasks.register('runWeb', JavaExec) {
    mainClass = 'top.spco.wordlesolver.WordleWebServer'
    classpath = sourceSets.main.runtimeClasspath
}

test {
    useJUnitPlatform()
}
tasks.withType(JavaExec).configureEach {
    def javafxLibs = configurations.runtimeClasspath
            .findAll { it.name.contains('javafx') }
            .collect { it.absolutePath }

    jvmArgs = [
            '--module-path', javafxLibs.join(File.pathSeparator),
            '--add-modules', 'javafx.controls,javafx.web'
    ]
}